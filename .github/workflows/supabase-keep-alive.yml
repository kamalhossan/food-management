# Pings the Supabase database every 3 days so the free-plan project
# is never paused for inactivity (Supabase pauses after ~7 idle days).
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 3 */3 * *" # 03:00 UTC every 3rd day
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/workers?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -o /dev/null -w "Supabase responded with HTTP %{http_code}\n"
